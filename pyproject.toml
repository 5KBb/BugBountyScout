[project]
name = "bugbountyscout"
version = "2.1.0"
description = "Automated checks for headers, TLS, XSS, SQLi (Bug Bounty tooling)."
authors = [{ name = "5KBb" }]
readme = "README.md"
license = { file = "LICENSE" }  # GPL-2.0 in repo
requires-python = ">=3.9"
dependencies = [
  "requests==2.32.3",
  "urllib3==2.2.2",
  "beautifulsoup4==4.12.3",
  "rich==13.7.1",
  "colorama==0.4.6",
  "cryptography==43.0.1",
  "python-dotenv==1.0.1",
]

[project.scripts]
bugbountyscout = "BugBounty_main:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E","F","I","B","UP","S"]

[tool.bandit]
skips = ["B101"]
